<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2A93B" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#F2A93B" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="640" height="400" fill="#101623"/>
  <rect width="640" height="400" fill="url(#grid)"/>
  <rect width="640" height="400" fill="url(#wash)"/>
  <rect x="0.5" y="0.5" width="639" height="399" fill="none" stroke="#212B3D" stroke-width="1"/>
  <g transform="translate(320,194)" fill="none" stroke="#F2A93B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- video frame -->
    <rect x="-75" y="-72" width="150" height="86" rx="10"/>
    <!-- play button -->
    <path d="M -10 -46 L 20 -29 L -10 -12 Z" fill="#F2A93B" stroke="none"/>
    <!-- timeline -->
    <path d="M -75 42 L 75 42" stroke-opacity="0.3"/>
    <path d="M -75 42 L 18 42"/>
    <circle cx="18" cy="42" r="7" fill="#F2A93B" stroke="none"/>
    <!-- timestamp chip -->
    <rect x="-12" y="58" width="60" height="26" rx="13" stroke-width="2.4"/>
    <text x="18" y="76" text-anchor="middle" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="14" font-weight="600" fill="#F2A93B" stroke="none">03:25</text>
    <!-- question bubble -->
    <circle cx="75" cy="-72" r="17" fill="#101623" stroke-width="2.4"/>
    <text x="75" y="-65" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#F2A93B" stroke="none">?</text>
    <!-- corner brackets -->
    <g stroke-width="2.4">
      <path d="M -105 -97 L -120 -97 L -120 -82"/>
      <path d="M 105 -97 L 120 -97 L 120 -82"/>
      <path d="M -105 97 L -120 97 L -120 82"/>
      <path d="M 105 97 L 120 97 L 120 82"/>
    </g>
  </g>
</svg>
